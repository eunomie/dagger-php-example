# Dagger workspace configuration
# Install modules with: dagger module install <module>
# Example:
#   dagger module install dagger.io/linux/wolfi

[modules]

[modules.php-sdk]
source = "dagger.io/sdk/php@global-client-opt-in"

[sdks.php]
module = "php-sdk"

[modules.my-module]
source = ".dagger/modules/my-module"

[sdks.php.scopes.".dagger/modules/my-module"]
is-module = true
name = "my-module"

[sdks.php.scopes.my-deps]
is-module = true
